<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página Inicial</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="inicial.css">
</head>

<body>

    <main>

        <div class="area-inicial">


            <section class="lado-pokedex">

                <section class="conteudo-primario">

                    <div class="texto-inicial">

                        <p>BEM-VINDO À</p>

                        <h1>POKÉ<span>DEX</span></h1>

                        <div class="pokebola-menor">
                            <img src="imagens/logo.png" alt="">
                        </div>

                    </div>

                </section>


                <div class="pokebola-principal">

                    <button class="botao-pokebola" id="entrar-pokedex">
                        <img src="imagens/logo.png" alt="Entrar na Pokédex">
                    </button>

                </div>


                <div class="setas">

                    <i class="fa-solid fa-chevron-up"></i>
                    <i class="fa-solid fa-chevron-up"></i>
                    <i class="fa-solid fa-chevron-up"></i>

                </div>


                <div class="click-pokebola">

                    <h1>CLIQUE NA POKÉBOLA</h1>

                </div>


                <div class="para-comecar">

                    <img src="imagens/logo.png" alt="">

                    <p>PARA COMEÇAR</p>

                    <img src="imagens/logo.png" alt="">

                </div>

            </section>


           <!-- area cadastro -->


            <section class="area-conta">

                <div class="card-conta">


                   

                    <div class="opcoes-conta">

                        <button type="button" class="opcao-login ativo">
                            Entrar
                        </button>

                        <button type="button" class="opcao-cadastro">
                            Criar conta
                        </button>

                    </div>



                    <form class="form-login">

                        <div class="titulo-formulario">

                            <span>BEM-VINDO DE VOLTA</span>

                            <h2>Entre na sua conta</h2>

                            <p>
                                Acesse sua Pokédex e continue sua jornada.
                            </p>

                        </div>


                        <div class="grupo-input">

                            <label for="email-login">
                                E-mail
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-envelope"></i>

                                <input type="email" id="email-login" placeholder="Digite seu e-mail">

                            </div>

                        </div>


                        <div class="grupo-input">

                            <label for="senha-login">
                                Senha
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password" id="senha-login" placeholder="Digite sua senha">

                                <button type="button" class="mostrar-senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <div class="opcoes-login">

                            <div class="lembrar">

                                <input type="checkbox" id="lembrar">

                                <label for="lembrar">
                                    Lembrar de mim
                                </label>

                            </div>


                            <a href="#" class="esqueci-senha">
                                Esqueci minha senha
                            </a>

                        </div>


                        <button type="submit" class="botao-conta">

                            ENTRAR

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>


                        <p class="trocar-conta">

                            Ainda não possui uma conta?

                            <button type="button" class="ir-cadastro">
                                Criar conta
                            </button>

                        </p>

                    </form>



                    <!-- =================================
                         CADASTRO
                    ================================== -->

                    <form class="form-cadastro">

                        <div class="titulo-formulario">

                            <span>COMECE SUA JORNADA</span>

                            <h2>Crie sua conta</h2>

                            <p>
                                Cadastre-se para salvar seus Pokémon favoritos.
                            </p>

                        </div>


                        <div class="grupo-input">

                            <label for="nome">
                                Nome de usuário
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-user"></i>

                                <input type="text" id="nome" placeholder="Digite seu nome">

                            </div>

                        </div>


                        <div class="grupo-input">

                            <label for="email-cadastro">
                                E-mail
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-envelope"></i>

                                <input type="email" id="email-cadastro" placeholder="Digite seu e-mail">

                            </div>

                        </div>


                        <div class="grupo-input">

                            <label for="senha-cadastro">
                                Senha
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password" id="senha-cadastro" placeholder="Digite sua senha">

                                <button type="button" class="mostrar-senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <div class="grupo-input">

                            <label for="confirmar-senha">
                                Confirmar senha
                            </label>

                            <div class="input-container">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password" id="confirmar-senha" placeholder="Digite sua senha novamente">

                                <button type="button" class="mostrar-senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <div class="termos">

                            <input type="checkbox" id="aceitar-termos">

                            <label for="aceitar-termos">
                                Concordo com os termos de uso.
                            </label>

                        </div>


                        <button type="submit" class="botao-conta">

                            CRIAR CONTA

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>


                        <p class="trocar-conta">

                            Já possui uma conta?

                            <button type="button" class="ir-login">
                                Entrar
                            </button>

                        </p>

                    </form>

                </div>

            </section>

        </div>

    </main>


    <div class="clarao"></div>


    <script src="inicial.js"></script>

</body>

</html>
